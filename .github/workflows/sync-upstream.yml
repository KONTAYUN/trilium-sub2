name: Sync Upstream Stable Release

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: sync-upstream-stable
  cancel-in-progress: false

permissions: {}

jobs:
  sync:
    name: Merge and verify latest upstream stable release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      updated: ${{ steps.sync.outputs.updated }}
      release_tag: ${{ steps.sync.outputs.release_tag }}
    env:
      UPSTREAM_REPOSITORY: TriliumNext/Trilium
      UPSTREAM_URL: https://github.com/TriliumNext/Trilium.git

    steps:
      - name: Checkout main with full history
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git and upstream
        shell: bash
        run: |
          set -euo pipefail
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream "${UPSTREAM_URL}"
          else
            git remote add upstream "${UPSTREAM_URL}"
          fi

      - name: Detect latest official stable release
        id: latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/${UPSTREAM_REPOSITORY}/releases/latest")"
          official_tag="$(jq -r '.tag_name' <<<"${release_json}")"
          draft="$(jq -r '.draft' <<<"${release_json}")"
          prerelease="$(jq -r '.prerelease' <<<"${release_json}")"

          if [[ "${draft}" != "false" || "${prerelease}" != "false" ]]; then
            echo "::error::GitHub latest release is not a formal stable release."
            exit 1
          fi

          if [[ ! "${official_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected official release tag: ${official_tag}"
            exit 1
          fi

          echo "tag=${official_tag}" >> "${GITHUB_OUTPUT}"
          echo "Latest official stable release: ${official_tag}"

      - name: Fetch upstream history and tags
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune upstream --tags

      - name: Set up Node.js for upstream SDK guard
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Plan and merge upstream release
        id: sync
        shell: bash
        env:
          OFFICIAL_TAG: ${{ steps.latest.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if ! git rev-parse --verify "${OFFICIAL_TAG}^{commit}" >/dev/null; then
            echo "::error::Official release tag was not fetched: ${OFFICIAL_TAG}"
            exit 1
          fi

          current_baseline="$(
            git tag --merged HEAD --list "v*" |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
              sort -V |
              tail -n 1 || true
          )"

          if [[ -z "${current_baseline}" ]]; then
            echo "::error::Unable to identify a stable upstream baseline in main history."
            exit 1
          fi

          base_sha="$(git rev-parse HEAD)"
          echo "Current upstream baseline: ${current_baseline}"

          set +e
          git merge-base --is-ancestor "${OFFICIAL_TAG}^{commit}" HEAD
          ancestor_status=$?
          set -e

          if [[ ${ancestor_status} -eq 0 ]]; then
            {
              echo "updated=false"
              echo "release_tag="
              echo "base_sha=${base_sha}"
            } >> "${GITHUB_OUTPUT}"
            echo "${OFFICIAL_TAG} is already present in main history; nothing to update."
            exit 0
          elif [[ ${ancestor_status} -ne 1 ]]; then
            echo "::error::Unable to determine whether ${OFFICIAL_TAG} is already synchronized."
            exit 1
          fi

          newest_tag="$(printf '%s\n%s\n' "${current_baseline}" "${OFFICIAL_TAG}" | sort -V | tail -n 1)"
          if [[ "${newest_tag}" != "${OFFICIAL_TAG}" || "${current_baseline}" == "${OFFICIAL_TAG}" ]]; then
            echo "::error::Official latest tag ${OFFICIAL_TAG} is not newer than baseline ${current_baseline}."
            exit 1
          fi

          if ! git merge-base --is-ancestor "${current_baseline}^{commit}" "${OFFICIAL_TAG}^{commit}"; then
            echo "::error::Official tag ${OFFICIAL_TAG} does not descend from baseline ${current_baseline}."
            exit 1
          fi

          # Read the manifests from the upstream tag itself, before the fork merge can
          # replace them with the patched archive.
          node --experimental-strip-types scripts/openai-patch-guard.mts check-upstream "${OFFICIAL_TAG}"

          auth_header="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"

          # A new workflow path can become active in this fork as soon as the merge is pushed.
          # Existing workflow edits/deletions are safe to inherit; additions, copies and renames
          # require a human review before this automation is allowed to publish anything.
          workflow_diff="$(git diff --name-status --find-renames --find-copies \
            "${current_baseline}^{commit}" "${OFFICIAL_TAG}^{commit}" -- .github/workflows/)"
          blocked_workflows="$(awk '$1 ~ /^[ARC][0-9]*$/ { print }' <<<"${workflow_diff}")"
          if [[ -n "${blocked_workflows}" ]]; then
            echo "::error::Upstream adds, copies, or renames workflow paths; manual review is required."
            printf '%s\n' "${blocked_workflows}"
            exit 1
          fi

          release_tag="${OFFICIAL_TAG}-sub2.1"
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/${release_tag}" >/dev/null 2>&1
          tag_status=$?
          set -e

          if [[ ${tag_status} -eq 0 ]]; then
            echo "::error::Target release tag already exists: ${release_tag}"
            exit 1
          elif [[ ${tag_status} -ne 2 ]]; then
            echo "::error::Unable to check target release tag: ${release_tag}"
            exit 1
          fi

          if ! git merge --no-ff --no-edit -m "chore: merge upstream ${OFFICIAL_TAG}" "${OFFICIAL_TAG}^{commit}"; then
            git merge --abort || true
            echo "::error::Git conflict while merging ${OFFICIAL_TAG}; no conflict was resolved automatically."
            exit 1
          fi

          {
            echo "updated=true"
            echo "release_tag=${release_tag}"
            echo "base_sha=${base_sha}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up pnpm
        if: steps.sync.outputs.updated == 'true'
        uses: pnpm/action-setup@v6

      - name: Restore patched SDK and refresh lockfile
        id: patch
        if: steps.sync.outputs.updated == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/openai-patch-guard.mts restore
          # Let pnpm regenerate the lockfile from structured manifests; never edit YAML by text.
          pnpm install --lockfile-only --ignore-scripts

          allowed_files=$'apps/server/package.json\npackages/trilium-core/package.json\npnpm-lock.yaml'
          unexpected_files="$(git status --porcelain=v1 | sed -E 's/^.. //' | while IFS= read -r path; do
            if ! grep -Fxq "${path}" <<<"${allowed_files}"; then
              printf '%s\n' "${path}"
            fi
          done)"
          if [[ -n "${unexpected_files}" ]]; then
            echo "::error::SDK restoration produced unexpected worktree changes."
            printf '%s\n' "${unexpected_files}"
            exit 1
          fi

          git add -- apps/server/package.json packages/trilium-core/package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "amend_required=false" >> "${GITHUB_OUTPUT}"
          else
            echo "amend_required=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Fold patched SDK restoration into merge commit
        if: steps.patch.outputs.amend_required == 'true'
        run: |
          git commit --amend --no-edit

      - name: Enable pnpm dependency cache
        if: steps.sync.outputs.updated == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Verify patched SDK archive
        if: steps.sync.outputs.updated == 'true'
        shell: bash
        env:
          NODE_USE_ENV_PROXY: "1"
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/openai-patch-guard.mts verify-tarball

      - name: Install dependencies
        if: steps.sync.outputs.updated == 'true'
        run: pnpm install --frozen-lockfile

      - name: Verify patched SDK resolution
        if: steps.sync.outputs.updated == 'true'
        run: node --experimental-strip-types scripts/openai-patch-guard.mts verify

      - name: Typecheck
        if: steps.sync.outputs.updated == 'true'
        run: pnpm typecheck

      - name: Run LLM and provider tests
        if: steps.sync.outputs.updated == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Directory-level filters intentionally cover every current and future spec in these
          # feature domains without maintaining a fragile per-file list.
          pnpm --filter client exec vitest run \
            src/services/llm_chat \
            src/widgets/type_widgets/llm_chat \
            src/widgets/type_widgets/options/llm/AddProviderModal

          pnpm --filter server exec vitest run \
            src/routes/api/llm_chat \
            src/services/llm \
            ../../packages/trilium-core/src/services/llm

      - name: Run OpenAI stateless Web Search replay regression
        if: steps.sync.outputs.updated == 'true'
        run: pnpm --filter server exec vitest run ../../packages/trilium-core/src/services/llm/providers/openai_stateless_payload.spec.ts

      - name: Build server
        if: steps.sync.outputs.updated == 'true'
        run: pnpm run server:build

      - name: Check diff whitespace
        if: steps.sync.outputs.updated == 'true'
        shell: bash
        env:
          BASE_SHA: ${{ steps.sync.outputs.base_sha }}
        run: |
          set -euo pipefail
          git diff --check "${BASE_SHA}..HEAD"
          git diff --check

      - name: Push main and release tag atomically
        if: steps.sync.outputs.updated == 'true'
        shell: bash
        env:
          BASE_SHA: ${{ steps.sync.outputs.base_sha }}
          RELEASE_TAG: ${{ steps.sync.outputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::Validation left tracked or untracked files in the worktree; refusing to publish."
            git status --short
            exit 1
          fi

          # Keep the write token out of the checkout config and expose it only after
          # all upstream-controlled install, test, and build steps have completed.
          auth_header="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth_header}"

          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          if [[ "$(git rev-parse refs/remotes/origin/main)" != "${BASE_SHA}" ]]; then
            echo "::error::origin/main changed while validation was running; refusing to overwrite it."
            exit 1
          fi

          set +e
          git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1
          tag_status=$?
          set -e

          if [[ ${tag_status} -eq 0 ]]; then
            echo "::error::Target release tag already exists: ${RELEASE_TAG}"
            exit 1
          elif [[ ${tag_status} -ne 2 ]]; then
            echo "::error::Unable to recheck target release tag: ${RELEASE_TAG}"
            exit 1
          fi

          git tag -a "${RELEASE_TAG}" -m "Trilium Sub2 ${RELEASE_TAG}"
          git push --atomic origin \
            HEAD:refs/heads/main \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"

  docker:
    name: Build release Docker image
    needs: sync
    if: needs.sync.result == 'success' && needs.sync.outputs.updated == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/sub2-docker.yml
    with:
      release_tag: ${{ needs.sync.outputs.release_tag }}
